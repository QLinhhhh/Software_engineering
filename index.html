<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Làm đề kiểm tra Công nghệ phần mềm</title>
  <style>
    :root {
      --ink: #172128;
      --muted: #607078;
      --line: #d7e0df;
      --paper: #ffffff;
      --page: #f2f5f3;
      --teal: #126b63;
      --teal-dark: #0d514c;
      --amber: #9a5b00;
      --green: #1f7a45;
      --red: #b33a3a;
      --blue: #245f9e;
      font-family: Arial, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--page);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--page); }
    button, select, textarea, input { font: inherit; letter-spacing: 0; }
    button, select, textarea { border: 1px solid var(--line); border-radius: 6px; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 3px solid rgba(18, 107, 99, .22); outline-offset: 2px;
    }
    header { background: #153038; color: #fff; border-bottom: 4px solid #d59b3d; }
    .header-inner { max-width: 1180px; margin: 0 auto; padding: 20px 24px 18px; }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: 0; }
    .subtitle { margin: 7px 0 0; color: #d5e5e3; line-height: 1.5; }
    .toolbar { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .toolbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: grid; grid-template-columns: minmax(260px, 1fr) auto auto; gap: 12px; align-items: end; }
    label.control { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    select { width: 100%; height: 42px; padding: 0 36px 0 12px; background: #fff; color: var(--ink); }
    .progress-block { min-width: 190px; }
    .progress-label { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
    .progress { width: 100%; height: 8px; overflow: hidden; border-radius: 4px; background: #e5ebea; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--teal); transition: width .2s ease; }
    button { min-height: 42px; padding: 0 15px; background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--teal-dark); }
    button.secondary { background: #fff; color: var(--ink); border-color: #aebcba; }
    button.secondary:hover { background: #eef3f1; }
    button:disabled { opacity: .58; cursor: wait; }
    main { max-width: 920px; margin: 0 auto; padding: 22px 24px 120px; }
    .exam-intro { padding: 0 0 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .exam-intro h2 { margin: 0 0 7px; font-size: 22px; }
    .exam-meta { color: var(--muted); line-height: 1.5; font-size: 14px; }
    .notice { margin-top: 12px; padding: 11px 13px; border-left: 4px solid #d59b3d; background: #fff8e9; color: #594416; line-height: 1.45; }
    .question { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; overflow: hidden; }
    .question-head { display: flex; justify-content: space-between; gap: 14px; padding: 11px 15px; background: #edf3f1; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 700; }
    .question-body { padding: 16px; }
    .question-text { font-size: 16px; line-height: 1.55; font-weight: 700; white-space: pre-wrap; }
    .options { display: grid; gap: 9px; margin-top: 14px; }
    .option { display: grid; grid-template-columns: 20px 28px minmax(0, 1fr); align-items: start; gap: 8px; padding: 10px 11px; border: 1px solid #dde5e3; border-radius: 6px; background: #fbfcfc; cursor: pointer; line-height: 1.45; }
    .option:hover { border-color: #8eaaa6; background: #f5faf8; }
    .option input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--teal); }
    .option-letter { font-weight: 800; color: var(--teal-dark); }
    .option.correct { border-color: #78b890; background: #eff9f2; }
    .option.incorrect-selected { border-color: #d79191; background: #fff1f1; }
    textarea { display: block; width: 100%; min-height: 150px; resize: vertical; margin-top: 14px; padding: 12px; color: var(--ink); background: #fff; line-height: 1.55; }
    .question-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    .question-actions button { min-width: 132px; }
    .result { margin-top: 15px; border-top: 1px solid var(--line); padding-top: 14px; }
    .result-title { font-weight: 800; margin-bottom: 10px; }
    .result-title.ok { color: var(--green); }
    .result-title.no { color: var(--red); }
    .answer-line, .explanation, .reference, .feedback { padding: 11px 12px; margin-top: 8px; line-height: 1.55; border-left: 4px solid var(--blue); background: #f1f6fb; white-space: pre-wrap; }
    .explanation { border-left-color: var(--teal); background: #f0f8f6; }
    .feedback { border-left-color: #d59b3d; background: #fff8e9; }
    .result h3 { margin: 14px 0 6px; font-size: 15px; }
    .result ul { margin: 6px 0 0 20px; padding: 0; line-height: 1.5; }
    .submit-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(20,45,50,.08); }
    .submit-inner { max-width: 920px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .completion { color: var(--muted); font-size: 14px; line-height: 1.4; }
    .completion strong { color: var(--ink); }
    .submit-actions { display: flex; gap: 9px; flex-shrink: 0; }
    .status { max-width: 920px; margin: 16px auto 0; padding: 12px 14px; border: 1px solid #c9d7d4; background: #edf6f4; border-radius: 6px; color: #244d48; line-height: 1.45; }
    .status.error { border-color: #e1b0b0; background: #fff0f0; color: #7e2727; }
    .summary { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 18px; }
    .summary h2 { margin: 0 0 12px; font-size: 20px; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .summary-item { padding: 12px; background: #f3f6f5; border-radius: 6px; }
    .summary-item strong { display: block; font-size: 22px; color: var(--teal-dark); }
    .api-gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #e9efed; }
    .api-gate-panel { width: min(100%, 460px); padding: 26px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 18px 45px rgba(21, 48, 56, .14); }
    .api-gate-panel h1 { color: var(--ink); font-size: 25px; }
    .api-gate-panel p { margin: 9px 0 20px; color: var(--muted); line-height: 1.55; }
    .api-key-form { display: grid; gap: 12px; }
    .api-key-form label { display: grid; gap: 7px; font-size: 14px; font-weight: 700; }
    .api-key-form input { width: 100%; height: 44px; padding: 0 12px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; }
    .api-key-error { color: var(--red); font-size: 14px; line-height: 1.45; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .header-inner, .toolbar-inner, main, .submit-inner { padding-left: 14px; padding-right: 14px; }
      h1 { font-size: 23px; }
      .toolbar-inner { grid-template-columns: 1fr; align-items: stretch; }
      .progress-block { min-width: 0; }
      .question-head { display: block; }
      .question-head span:last-child { display: block; margin-top: 4px; }
      .summary-grid { grid-template-columns: 1fr; }
      .submit-inner { align-items: stretch; flex-direction: column; }
      .submit-actions { width: 100%; }
      .submit-actions button { flex: 1; }
      main { padding-bottom: 165px; }
    }
  </style>
</head>
<body>
  <section class="api-gate" id="apiGate" aria-labelledby="apiGateTitle">
    <div class="api-gate-panel">
      <h1 id="apiGateTitle">Nhập Google AI API key</h1>
      <p>API key chỉ được dùng trong tab hiện tại để chấm bài và không được lưu vào trình duyệt.</p>
      <form class="api-key-form" id="apiKeyForm">
        <label for="apiKeyInput">API key
          <input type="password" id="apiKeyInput" name="apiKey" placeholder="Nhập API key của Google AI Studio" autocomplete="off" required>
        </label>
        <div class="api-key-error" id="apiKeyError" role="alert" hidden></div>
        <button type="submit">Vào trang làm bài</button>
      </form>
    </div>
  </section>
  <div id="appShell" hidden>
  <header>
    <div class="header-inner">
      <h1>Làm đề kiểm tra Công nghệ phần mềm</h1>
      <p class="subtitle">Chọn một đề, trả lời và nộp riêng từng câu để xem kết quả ngay mà không làm gián đoạn các câu khác.</p>
    </div>
  </header>
  <div class="toolbar">
    <div class="toolbar-inner">
      <label class="control">Chọn đề
        <select id="examSelect"></select>
      </label>
      <div class="progress-block">
        <div class="progress-label"><span>Tiến độ</span><span id="progressText">0/0</span></div>
        <div class="progress"><span id="progressFill"></span></div>
      </div>
      <button type="button" class="secondary" id="resetTop">Làm lại đề</button>
    </div>
  </div>
  <div id="apiStatus" class="status" hidden></div>
  <main id="main"></main>
  <div class="submit-dock">
    <div class="submit-inner">
      <div class="completion" id="completionText"></div>
      <div class="submit-actions">
        <button type="button" class="secondary" id="resetBtn" hidden>Làm lại đề</button>
      </div>
    </div>
  </div>
  </div>

  <script>
    const APP_DATA = {"exams":[{"id":"EX01","title":"Bài 1 & 2 - Giới thiệu Công nghệ phần mềm","sourceFile":"testBank_Bai01_02_GioiThieuSE_DETHI.docx","chapters":[1,2],"mcCount":22,"essayCount":2,"questions":[{"id":"EX01-Q001","kind":"mc","question":"Phần mềm gồm:","options":["Chương trình máy tính","Cấu trúc dữ liệu (ngoài và trong)","Tài liệu"],"knownCorrect":[0,1,2],"providedAnswer":""},{"id":"EX01-Q002","kind":"mc","question":"Chọn phát biểu đúng nhất dựa trên những phát biểu sau đây","options":["Phần mềm là sản phẩm được các kỹ sư phần mềm thiết kế và xây dựng","Phần mềm là một phần tử logic","Phần mềm là một tập các ứng dụng được xây dựng bởi các kỹ sư phần mềm"],"knownCorrect":[0,1],"providedAnswer":""},{"id":"EX01-Q003","kind":"mc","question":"Chọn phát biểu đúng nhất về hệ thống thông tin (HTTT).","options":["HTTT gồm phần cứng và cơ sở hạ tầng mạng truyền thông, phần mềm, dữ liệu, con người và các quy trình đảm bảo HTTT được sử dụng hiệu quả và có khả năng bảo trì.","HTTT là về phần cứng và cơ sở hạ tầng mạng truyền thông.","HTTT chính là tên gọi khác của phần mềm.","HTTT là một thành phần quan trọng của phần mềm"],"knownCorrect":[0],"providedAnswer":""},{"id":"EX01-Q004","kind":"mc","question":"Chọn phát biểu đúng nhất về mối quan hệ giữa phần mềm và hệ thống thông tin (HTTT).","options":["Phần mềm là một thành phần quan trọng của HTTT","HTTT là về phần cứng và cơ sở hạ tầng mạng truyền thông. Phần mềm được xây dựng trên nền tảng của HTTT","Hai khái niệm này có cùng ý nghĩa","HTTT là một thành phần quan trọng của phần mềm"],"knownCorrect":[0],"providedAnswer":""},{"id":"EX01-Q005","kind":"mc","question":"Đâu là đặc trưng của một sản phẩm phần mềm?","options":["không được phát triển theo khuôn mẫu có sẵn","không bị thoái hóa như phần cứng và các thiết bị vật lý khác","phức tạp, vô hình, được phát triển theo nhóm và thường xuyên bị thay đổi"],"knownCorrect":[0,1,2],"providedAnswer":""},{"id":"EX01-Q006","kind":"mc","question":"Các bộ biên dịch (Compilers) và các hệ điều hành thuộc loại phần mềm nào?","options":["Phần mềm hệ thống","Phần mềm ứng dụng","Phần mềm tiện ích","Phần mềm khoa học kỹ thuật"],"knownCorrect":[0],"providedAnswer":""},{"id":"EX01-Q007","kind":"mc","question":"CASE viết tắt của từ gì?","options":["Computer Aided Software Engineering","Component Aided Software Engineering","Computer Analysis Software Engineering","Computer Adviced Software Engineering"],"knownCorrect":[0],"providedAnswer":""},{"id":"EX01-Q008","kind":"mc","question":"Độ đo nào phản ánh khả năng dễ học để sử dụng hệ thống phần mềm?","options":["Dễ sử dụng","Đầy đủ chức năng","Tin cậy","Dễ bảo trì"],"knownCorrect":[0],"providedAnswer":""},{"id":"EX01-Q009","kind":"mc","question":"Độ đo nào phản ánh khả năng sửa lỗi và phục hồi lỗi của phần mềm?","options":["Độ tin cậy","Dễ sử dụng","Dễ bảo trì","Tính hiệu quả"],"knownCorrect":[0],"providedAnswer":""},{"id":"EX01-Q010","kind":"mc","question":"Độ đo nào phản ánh khả năng thay đổi/nâng cấp của hệ thống phần mềm?","options":["Dễ bảo trì","Đầy đủ chức năng","Tin cậy","Dễ sử dụng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q011","kind":"mc","question":"Độ đo nào phản ánh khả năng đưa ra kết quả trong một thời gian xử lý và một tốc độ thông lượng hợp lý của hệ thống phần mềm?","options":["Tính hiệu quả","Đầy đủ chức năng","Tin cậy","Dễ sử dụng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q012","kind":"mc","question":"Độ đo nào phản ánh khả năng có thể cung cấp một tập các chức năng thích hợp cho công việc cụ thể phục vụ mục đích của người sử dụng?","options":["Đầy đủ chức năng","Tính hiệu quả","Tin cậy","Dễ sử dụng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q013","kind":"mc","question":"Độ đo nào phản ánh khả năng có thể thích nghi với nhiều môi trường khác nhau mà không cần phải thay đổi phần mềm?","options":["Tính khả chuyển","Tính hiệu quả","Tin cậy","Dễ sử dụng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q014","kind":"mc","question":"Phần mềm bị thay  độ tin cậy cao, thời gian phát triển nhanh và chi phí hợp lý","Phần mềm có độ tin cậy cao","Phần mềm có chi phí hợp lý"],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q021","kind":"mc","question":"Chọn phát biểu đúng nhất về vòng đời phát triển phần mềm.","options":["Là quá trình tồn tại của phần mềm từ khi khách hàng có nhu cầu phát triển đến khi nó bị bỏ đi","Là quá trình phát triển phần mềm","Là quá trình vận hành và bảo trì phần mềm","Là quá trình phân tích thiết kế phần mềm"],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q022","kind":"mc","question":"Một dự án phát triển phầm mềm là thất bại khi:","options":["Bất kỳ một trong các phương án còn lại","Không đủ tính năng hoặc đủ nhưng khó sử dụng","Vượt quá kinh phí dự kiến","Vượt quá thời gian dự kiến"],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q023","kind":"essay","question":"Mô tả các tiêu chí để đánh giá chất lượng phần mềm.","options":[],"knownCorrect":[],"providedAnswer":""},{"id":"EX01-Q024","kind":"essay","question":"Phần mềm bị tiến hóa trong những trường hợp nào? Những thách thức nào phải đối mặt khi phần mềm bị tiến hóa?","options":[],"knownCorrect":[],"providedAnswer":""}],"knowledge":"- Chất lượng phần mềm là mức độ phần mềm đáp ứng nhu cầu chức năng, phi chức năng và kỳ vọng sử dụng trong bối cảnh cụ thể. Vai trò chính là Đưa ra tiêu chí đánh giá sản phẩm ngoài chuyện chạy đúng. Ví dụ áp dụng: so sánh hai hệ thống cùng chức năng nhưng khác độ tin cậy và dễ dùng. Khi áp dụng Chất lượng phần mềm, cần gắn với mục tiêu: Đưa ra tiêu chí đánh giá sản phẩm ngoài chuyện chạy đúng. Có thể nhận diện qua tình huống: so sánh hai hệ thống cùng chức năng nhưng khác độ tin cậy và dễ dùng. Sai lầm cần tránh là Bỏ qua tiêu chí phi chức năng khi nghiệm thu. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Công cụ CASE là công cụ hỗ trợ các hoạt động công nghệ phần mềm như mô hình hóa, quản lý yêu c ụ áp dụng: hệ thống tuân thủ pháp lý có yêu cầu rõ từ đầu. Khi áp dụng Mô hình thác nước, cần gắn với mục tiêu: Phù hợp khi yêu cầu ổn định và cần tài liệu chặt. Có thể nhận diện qua tình huống: hệ thống tuân thủ pháp lý có yêu cầu rõ từ đầu. Sai lầm cần tránh là Áp dụng cứng nhắc khi khách hàng chưa hiểu nhu cầu. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Mô hình xoắn ốc là mô hình lặp dựa trên phân tích rủi ro, mỗi vòng gồm mục tiêu, đánh giá rủi ro, phát triển và lập kế hoạch. Vai trò chính là Phù hợp với dự án lớn, nhiều rủi ro hoặc yêu cầu chưa chắc chắn. Ví dụ áp dụng: dự án hệ thống y tế đánh giá rủi ro an toàn ở từng vòng. Khi áp dụng Mô hình xoắn ốc, cần gắn với mục tiêu: Phù hợp với dự án lớn, nhiều rủi ro hoặc yêu cầu chưa chắc chắn. Có thể nhận diện qua tình huống: dự án hệ thống y tế đánh giá rủi ro an toàn ở từng vòng. Sai lầm cần tránh là Dùng xoắn ốc cho bài toán nhỏ làm tăng chi phí quản lý. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Nghiên cứu khả thi là đánh giá tính khả thi kỹ thuật, kinh tế, vận hành và lịch trước khi cam kết dự án. Vai trò chính là Giảm nguy cơ đầu tư vào dự án không làm được hoặc không đáng làm. Ví dụ áp dụng: trước khi xây app, nhóm kiểm tra ngân sách và khả năng tích hợp. Khi áp dụng Nghiên cứu khả thi, cần gắn với mục tiêu: Giảm nguy cơ đầu tư vào dự án không làm được hoặc không đáng làm. Có thể nhận diện qua tình huống: trước khi xây app, nhóm kiểm tra ngân sách và khả năng tích hợp. Sai lầm cần tránh là Chỉ hỏi một người dùng rồi kết luận toàn dự án khả thi. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Quy trình phần mềm là tập hợp hoạt động, vai trò, sản phẩm trung gian và quy tắc để phát triển và tiến hóa phần mềm. Vai trò chính là Tạo cách làm có thể quản lý và cải tiến. Ví dụ áp dụng: nhóm quy định các bước từ yêu cầu đến triển khai. Khi áp dụng Quy trình phần mềm, cần gắn với mục tiêu: Tạo cách làm có thể quản lý và cải tiến. Có thể nhận diện qua tình huống: nhóm quy định các bước từ yêu cầu đến triển khai. Sai lầm cần tránh là Có quy trình trên giấy nhưng không đo lường và cải tiến. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- RAD là cách phát triển ứng dụng nhanh nhờ phân chia module, tái sử dụng thành phần và làm việc sát với người dùng. Vai trò chính là Rút ngắn thời gian khi phạm vi có thể chia nhỏ và đội đủ mạnh. Ví dụ áp dụng: nhóm nhanh chóng dựng module quản lý báo cáo nội bộ. Khi áp dụng RAD, cần gắn với mục tiêu: Rút ngắn thời gian khi phạm vi có thể chia nhỏ và đội đủ mạnh. Có thể nhận diện qua tình huống: nhóm nhanh chóng dựng module quản lý báo cáo nội bộ. Sai lầm cần tránh là Chạy theo tốc độ mà bỏ qua tích hợp và chất lượng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- RUP là quy trình thống nhất có các pha inception, elaboration, construction và transition, nhấn mạnh use case và kiến trúc. Vai trò chính là Phù hợp dự án cần mô hình hóa, quản lý rủi ro kiến trúc và lặp có kiểm soát. Ví dụ áp dụng: pha elaboration làm rõ kiến trúc và rủi ro chính. Khi áp dụng RUP, cần gắn với mục tiêu: Phù hợp dự án cần mô hình hóa, quản lý rủi ro kiến trúc và lặp có kiểm soát. Có thể nhận diện qua tình huống: pha elaboration làm rõ kiến trúc và rủi ro chính. Sai lầm cần tránh là Biến rup thành tài liệu nặng mà không lặp thực chất. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- SDLC là vòng đời phát triển hệ thống từ ý tưởng, yêu cầu, thiết kế, cài đặt, kiểm thử, triển khai đến bảo trì. Vai trò chính là Giúp nhìn dự án theo toàn bộ vòng đời. Ví dụ áp dụng: dự án đi qua phân tích, thiết kế, code, test và vận hành. Khi áp dụng SDLC, cần gắn với mục tiêu: Giúp nhìn dự án theo toàn bộ vòng đời. Có thể nhận diện qua tình huống: dự án đi qua phân tích, thiết kế, code, test và vận hành. Sai lầm cần tránh là Kết thúc quản lý ngay sau khi code xong. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- V-Model là mô hình nhấn mạnh quan hệ giữa giai đoạn phát triển và mức kiểm thử tương ứng. Vai trò chính là Giúp lập kế hoạch kiểm thử song song với đặc tả và thiết kế. Ví dụ áp dụng: yêu cầu hệ thống ánh xạ với acceptance test, thiết kế module ánh xạ với unit test. Khi áp dụng V-Model, cần gắn với mục tiêu: Giúp lập kế hoạch kiểm thử song song với đặc tả và thiết kế. Có thể nhận diện qua tình huống: yêu cầu hệ thống ánh xạ với acceptance test, thiết kế module ánh xạ với unit test. Sai lầm cần tránh là Xem v-model là bảo đảm thay đổi dễ dàng trong mọi tình huống. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.","referenceSources":"03-process models (1).pdf; 04- processes RUP - Agile (1).pdf; Test 3; Ôn tập bài 3; Sommerville Ch.2; Pressman Ch.2, Ch.4"},{"id":"EX03","title":"Bài 4 - RUP, Agile và TDD","sourceFile":"testBank_Bai04-RUP_DETHI.docx","chapters":[4],"mcCount":23,"essayCount":0,"questions":[{"id":"EX03-Q001","kind":"mc","question":"Agile: điều quan trọng hơn là xây dựng phần mềm đáp ứng được nhu cầu hiện tại của khách hàng hơn là lo lắng về các tính năng cần thiết trong tương lai.","options":["Đúng","Sai"],"knownCorrect":[],"providedAnswer":""},{"id":"EX03-Q002","kind":"mc","question":"Phát triển lặp và tăng dần (iterative, incremental development) đều được vận dụng trong RUP.","options":["Đúng","Sai"],"knownCorrect":[],"pro say","question":"Anh/chị hãy thử đưa ra một cấu trúc chung nhất cho tài liệu đặc tả yêu cầu. Trình bày ngắn gọn các lợi ích chính của tài liệu đặc tả yêu cầu?","options":[],"knownCorrect":[],"providedAnswer":""}],"knowledge":"- Actor là vai trò bên ngoài tương tác với hệ thống, có thể là người, hệ thống khác hoặc thiết bị. Vai trò chính là Giúp xác định ranh giới hệ thống và nguồn yêu cầu. Ví dụ áp dụng: Sinh viên, Quản trị viên, Cổng thanh toán là actor. Khi áp dụng Actor, cần gắn với mục tiêu: Giúp xác định ranh giới hệ thống và nguồn yêu cầu. Có thể nhận diện qua tình huống: Sinh viên, Quản trị viên, Cổng thanh toán là actor. Sai lầm cần tránh là Đưa module nội bộ thành actor dù không nằm ngoài hệ thống. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Class diagram là sơ đồ mô tả lớp, thuộc tính, phương thức và quan hệ tĩnh giữa các lớp. Vai trò chính là Giúp phân tích cấu trúc miền và thiết kế dữ liệu/đối tượng. Ví dụ áp dụng: lớp SinhVien liên kết với Phong và HoaDon. Khi áp dụng Class diagram, cần gắn với mục tiêu: Giúp phân tích cấu trúc miền và thiết kế dữ liệu/đối tượng. Có thể nhận diện qua tình huống: lớp SinhVien liên kết với Phong và HoaDon. Sai lầm cần tránh là Thêm lớp giao diện kỹ thuật quá sớm khi còn phân tích miền. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Context model là mô hình cho thấy hệ thống nằm trong môi trường nào và tương tác với hệ thống bên ngoài nào. Vai trò chính là Giúp xác định ranh giới, interface và phụ thuộc. Ví dụ áp dụng: hệ thống ký túc xá kết nối cổng thanh toán và hệ thống sinh viên. Khi áp dụng Context model, cần gắn với mục tiêu: Giúp xác định ranh giới, interface và phụ thuộc. Có thể nhận diện qua tình huống: hệ thống ký túc xá kết nối cổng thanh toán và hệ thống sinh viên. Sai lầm cần tránh là hiểu khái niệm quá hẹp, áp dụng máy móc hoặc bỏ qua bối cảnh dự án. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Elicitation là hoạt động khám phá và thu thập nhu cầu từ stakeholder, tài liệu, hệ thống hiện tại và bối cảnh sử dụng. Vai trò chính là Giảm rủi ro bỏ sót hoặc hiểu sai yêu cầu. Ví dụ áp dụng: phỏng vấn quản lý ký túc xá và quan sát quy trình đăng ký phòng. Khi áp dụng Elicitation, cần gắn với mục tiêu: Giảm rủi ro bỏ sót hoặc hiểu sai yêu cầu. Có thể nhận diện qua tình huống: phỏng vấn quản lý ký túc xá và quan sát quy trình đăng ký phòng. Sai lầm cần tránh là Không xác minh mâu thuẫn giữa các nguồn yêu cầu. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Extend là quan hệ bổ sung hành vi tùy chọn hoặc điều kiện vào use case cơ sở. Vai trò chính là Giúp mô hình hóa biến thể mà không làm rối luồng chính. Ví dụ áp dụng: Thanh toán online extend Thanh toán hóa đơn khi chọn phương thức online. Khi áp dụng Extend, cần gắn với mục tiêu: Giúp mô hình hóa biến thể mà không làm rối luồng chính. Có thể nhận diện qua tình huống: Thanh toán online extend Thanh toán hóa đơn khi chọn phương thức online. Sai lầm cần tránh là Dùng extend thay cho phân rã chức năng bắt buộc. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Include là quan hệ use case này luôn dùng lại hành vi chung của use case khác. Vai trò chính là Giúp tránh lặp lại luồng bắt buộc. Ví dụ áp dụng: Thanh toán hóa đơn include Xác thực sinh viên. Khi áp dụng Include, cần gắn với mục tiêu: Giúp tránh lặp lại luồng bắt buộc. Có thể nhận diện qua tình huống: Thanh toán hóa đơn include Xác thực sinh viên. Sai lầm cần tránh là Lạm dụng include cho mọi quan hệ liên quan mơ hồ. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Sequence diagram là sơ đồ mô tả thông điệp theo thời gian giữa các đối tượng hoặc thành phần. Vai trò chính là Giúp hiểu luồng tương tác cho một kịch bản. Ví dụ áp dụng: luồng sinh viên gửi yêu cầu thanh toán tới hệ thống và cổng thanh toán. Khi áp dụng Sequence diagram, cần gắn với mục tiêu: Giúp hiểu luồng tương tác cho một kịch bản. Có thể nhận diện qua tình huống: luồng sinh viên gửi yêu cầu thanh toán tới hệ thống và cổng thanh toán. Sai lầm cần tránh là Vẽ sequence cho mọi trường hợp nhỏ gây quá tải tài liệu. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- State diagram là sơ đồ mô tả các trạng thái của một đối tượng và chuyển trạng thái do sự kiện. Vai trò chính là Hữu ích với đối tượng có vòng đời rõ. Ví dụ áp dụng: hóa đơn chuyển từ Chưa thanh toán sang Đã thanh toán hoặc Quá hạn. Khi áp dụng State diagram, cần gắn với mục tiêu: Hữu ích với đối tượng có vòng đời rõ. Có thể nhận diện qua tình huống: hóa đơn chuyển từ Chưa thanh toán sang Đã thanh toán hoặc Quá hạn. Sai lầm cần tránh là Dùng state diagram cho đối tượng không có trạng thái đáng kể. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Traceability là khả năng truy vết quan hệ giữa yêu cầu, thiết kế, mã nguồn, test và thay đổi. Vai trò chính là Giúp phân tích tác động và chứng minh bao phủ kiểm thử. Ví dụ áp dụng: một test case liên kết tới yêu cầu thanh toán hóa đơn. Khi áp dụng Traceability, cần gắn với mục tiêu: Giúp phân tích tác động và chứng minh bao phủ kiểm thử. Có thể nhận diện qua tình huống: một test case liên kết tới yêu cầu thanh toán hóa đơn. Sai lầm cần tránh là Không cập nhật trace khi yêu cầu đổi. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Use case là mô tả tương tác giữa actor và hệ thống để đạt một mục tiêu có giá trị. Vai trò chính là Giúp phân tích chức năng theo góc nhìn người dùng. Ví dụ áp dụng: Sinh viên đăng ký dịch vụ internet qua hệ thống. Khi áp dụng Use case, cần gắn với mục tiêu: Giúp phân tích chức năng theo góc nhìn người dùng. Có thể nhận diện qua tình huống: Sinh viên đăng ký dịch vụ internet qua hệ thống. Sai lầm cần tránh là Viết use case ở mức quá nhỏ như bấm từng phím. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Validation yêu cầu là kiểm tra yêu cầu có đúng, đầy đủ, nhất quán, khả thi và kiểm thử được hay không. Vai trò chính là Giúp phát hiện lỗi yêu cầu trước khi thiết kế và code. Ví dụ áp dụng: review SRS để tìm yêu cầu mơ hồ trước khi ký duyệt. Khi áp dụng Validation yêu cầu, cần gắn với mục tiêu: Giúp phát hiện lỗi yêu cầu trước khi thiết kế và code. Có thể nhận diện qua tình huống: review SRS để tìm yêu cầu mơ hồ trước khi ký duyệt. Sai lầm cần tránh là Bỏ qua validation vì nghĩ khách hàng đã nói thì chắc đúng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Yêu cầu chức năng là mô tả dịch vụ, hành vi hoặc chức năng cụ thể mà hệ thống phải cung cấp. Vai trò chính là Là cơ sở trực tiếp cho use case và test chức năng. Ví dụ áp dụng: hệ thống cho phép sinh viên đăng ký dịch vụ internet. Khi áp dụng Yêu cầu chức năng, cần gắn với mục tiêu: Là cơ sở trực tiếp cho use case và test chức năng. Có thể nhận diện qua tình huống: hệ thống cho phép sinh viên đăng ký dịch vụ internet. Sai lầm cần tránh là Trộn chức năng với ràng buộc chất lượng khiến đặc tả khó kiểm thử. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Yêu cầu phi chức năng là mô tả ràng buộc chất lượng hoặc điều kiện vận hành như hiệu năng, bảo mật, khả dụng, chuẩn và pháp lý. Vai trò chính là Giúp đánh giá hệ thống ngoài danh sách chức năng. Ví dụ áp dụng: trang thanh toán phản hồi dưới 3 giây với 500 người dùng. Khi áp dụng Yêu cầu phi chức năng, cần gắn với mục tiêu: Giúp đánh giá hệ thống ngoài danh sách chức năng. Có thể nhận diện qua tình huống: trang thanh toán phản hồi dưới 3 giây với 500 người dùng. Sai lầm cần tránh là Viết phi chức năng không đo được như 'hệ thống phải nhanh'. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.","referenceSources":"05_KhaiNiemYeuCau; 06_QuyTrinhThuThapYC; 07_MoHinhHoaPhanMem; Slides3-6 UML; Test 4-5; Ôn tập bài 5; Sommerville Ch.4-5; Pressman Ch.7-8"},{"id":"EX05","title":"Bài 6 - Quy trình thu thập yêu cầu","sourceFile":"testBank_Bai06_QuyTrinhThuThapYeuCau_DETHI.docx","chapters":[5],"mcCount":9,"essayCount":2,"questions":[{"id":"EX05-Q001","kind":"mc","question":"Trong bước thẩm định yêu cầu, mô hình yêu cầu được kiểm duyệt chỉ với một mục đích đảm bảo tính khả thi kỹ thuật.","options":["Sai","Đúng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX05-Q002","kind":"mc","question":"Kết quả của khâu kỹ nghệ yêu cầu là một mô hình phân tích xác định (các) miền vấn đề nào sau đây?","options":["Tất cả các phương án","Thông tin","Chức năng","Hành vi"],"knownCorrect":[],"providedAnswer":""},{"id":"EX05-Q003","kind":"mc","question":"Trong nhiều trường hợp không nhất thiết phải tạo ra biểu diễn đồ họa cho một kịch bản sử dụng.","options":["Đúng","Sai"],"knownCorrect":[],"providedAnswer":""},{"id":"EX05-Q004","kind":"mc","question":"Trong đàm phán win-win, nhu cầu của khách hàng được đáp ứng ngay cả khi nhu cầu của nhà phát triển có thể không được đáp ứng.","options":["Sai","Đúng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX05-Q005","kind":"mc","question":"Kỹ sư phần mềm c gắn với mục tiêu: Giúp xác định ranh giới hệ thống và nguồn yêu cầu. Có thể nhận diện qua tình huống: Sinh viên, Quản trị viên, Cổng thanh toán là actor. Sai lầm cần tránh là Đưa module nội bộ thành actor dù không nằm ngoài hệ thống. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Class diagram là sơ đồ mô tả lớp, thuộc tính, phương thức và quan hệ tĩnh giữa các lớp. Vai trò chính là Giúp phân tích cấu trúc miền và thiết kế dữ liệu/đối tượng. Ví dụ áp dụng: lớp SinhVien liên kết với Phong và HoaDon. Khi áp dụng Class diagram, cần gắn với mục tiêu: Giúp phân tích cấu trúc miền và thiết kế dữ liệu/đối tượng. Có thể nhận diện qua tình huống: lớp SinhVien liên kết với Phong và HoaDon. Sai lầm cần tránh là Thêm lớp giao diện kỹ thuật quá sớm khi còn phân tích miền. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Context model là mô hình cho thấy hệ thống nằm trong môi trường nào và tương tác với hệ thống bên ngoài nào. Vai trò chính là Giúp xác định ranh giới, interface và phụ thuộc. Ví dụ áp dụng: hệ thống ký túc xá kết nối cổng thanh toán và hệ thống sinh viên. Khi áp dụng Context model, cần gắn với mục tiêu: Giúp xác định ranh giới, interface và phụ thuộc. Có thể nhận diện qua tình huống: hệ thống ký túc xá kết nối cổng thanh toán và hệ thống sinh viên. Sai lầm cần tránh là hiểu khái niệm quá hẹp, áp dụng máy móc hoặc bỏ qua bối cảnh dự án. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Elicitation là hoạt động khám phá và thu thập nhu cầu từ stakeholder, tài liệu, hệ thống hiện tại và bối cảnh sử dụng. Vai trò chính là Giảm rủi ro bỏ sót hoặc hiểu sai yêu cầu. Ví dụ áp dụng: phỏng vấn quản lý ký túc xá và quan sát quy trình đăng ký phòng. Khi áp dụng Elicitation, cần gắn với mục tiêu: Giảm rủi ro bỏ sót hoặc hiểu sai yêu cầu. Có thể nhận diện qua tình huống: phỏng vấn quản lý ký túc xá và quan sát quy trình đăng ký phòng. Sai lầm cần tránh là Không xác minh mâu thuẫn giữa các nguồn yêu cầu. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Extend là quan hệ bổ sung hành vi tùy chọn hoặc điều kiện vào use case cơ sở. Vai trò chính là Giúp mô hình hóa biến thể mà không làm rối luồng chính. Ví dụ áp dụng: Thanh toán online extend Thanh toán hóa đơn khi chọn phương thức online. Khi áp dụng Extend, cần gắn với mục tiêu: Giúp mô hình hóa biến thể mà không làm rối luồng chính. Có thể nhận diện qua tình huống: Thanh toán online extend Thanh toán hóa đơn khi chọn phương thức online. Sai lầm cần tránh là Dùng extend thay cho phân rã chức năng bắt buộc. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Include là quan hệ use case này luôn dùng lại hành vi chung của use case khác. Vai trò chính là Giúp tránh lặp lại luồng bắt buộc. Ví dụ áp dụng: Thanh toán hóa đơn include Xác thực sinh viên. Khi áp dụng Include, cần gắn với mục tiêu: Giúp tránh lặp lại luồng bắt buộc. Có thể nhận diện qua tình huống: Thanh toán hóa đơn include Xác thực sinh viên. Sai lầm cần tránh là Lạm dụng include cho mọi quan hệ liên quan mơ hồ. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Sequence diagram là sơ đồ mô tả thông điệp theo thời gian giữa các đối tượng hoặc thành phần. Vai trò chính là Giúp hiểu luồng tương tác cho một kịch bản. Ví dụ áp dụng: luồng sinh viên gửi yêu cầu thanh toán tới hệ thống và cổng thanh toán. Khi áp dụng Sequence diagram, cần gắn với mục tiêu: Giúp hiểu luồng tương tác cho một kịch bản. Có thể nhận diện qua tình huống: luồng sinh viên gửi yêu cầu thanh toán tới hệ thống và cổng thanh toán. Sai lầm cần tránh là Vẽ sequence cho mọi trường hợp nhỏ gây quá tải tài liệu. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- State diagram là sơ đồ mô tả các trạng thái của một đối tượng và chuyển trạng thái do sự kiện. Vai trò chính là Hữu ích với đối tượng có vòng đời rõ. Ví dụ áp dụng: hóa đơn chuyển từ Chưa thanh toán sang Đã thanh toán hoặc Quá hạn. Khi áp dụng State diagram, cần gắn với mục tiêu: Hữu ích với đối tượng có vòng đời rõ. Có thể nhận diện qua tình huống: hóa đơn chuyển từ Chưa thanh toán sang Đã thanh toán hoặc Quá hạn. Sai lầm cần tránh là Dùng state diagram cho đối tượng không có trạng thái đáng kể. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Traceability là khả năng truy vết quan hệ giữa yêu cầu, thiết kế, mã nguồn, test và thay đổi. Vai trò chính là Giúp phân tích tác động và chứng minh bao phủ kiểm thử. Ví dụ áp dụng: một test case liên kết tới yêu cầu thanh toán hóa đơn. Khi áp dụng Traceability, cần gắn với mục tiêu: Giúp phân tích tác động và chứng minh bao phủ kiểm thử. Có thể nhận diện qua tình huống: một test case liên kết tới yêu cầu thanh toán hóa đơn. Sai lầm cần tránh là Không cập nhật trace khi yêu cầu đổi. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Use case là mô tả tương tác giữa actor và hệ thống để đạt một mục tiêu có giá trị. Vai trò chính là Giúp phân tích chức năng theo góc nhìn người dùng. Ví dụ áp dụng: Sinh viên đăng ký dịch vụ internet qua hệ thống. Khi áp dụng Use case, cần gắn với mục tiêu: Giúp phân tích chức năng theo góc nhìn người dùng. Có thể nhận diện qua tình huống: Sinh viên đăng ký dịch vụ internet qua hệ thống. Sai lầm cần tránh là Vi :["Các phần tử dựa vào kịch bản (scenario)","Các phần tử dựa vào dòng (flow)","Các phần tử dựa vào lớp (class)","Các phần tử hành vi (behavior)"],"knownCorrect":[],"providedAnswer":""},{"id":"EX06-Q007","kind":"mc","question":"Biểu đồ chuyển trạng thái _____.","options":["cho biết các phản ứng của hệ thống với các sự kiện bên ngoài","biểu diễn các mối quan hệ giữa các đối tượng","biểu diễn các chức năng để chuyển tiếp dòng dữ liệu","cho biết cách các dữ liệu được chuyển tiếp trong hệ thống"],"knownCorrect":[],"providedAnswer":""},{"id":"EX06-Q008","kind":"essay","question":"Anh/chị hãy trình bày một số lợi ích của mô hình hóa hệ thống phần mềm? Hãy sử dụng biểu đồ hoạt động để mô tả ca sử dụng “đăng ký học phần” của hệ thống đăng ký học phần tại Trường ĐHCN.","options":[],"knownCorrect":[],"providedAnswer":""},{"id":"EX06-Q009","kind":"essay","question":"Anh/chị hãy diễn giải những góc nhìn cơ bản trong mô hình hóa phần mềm? Lấy ví dụ minh họa trong ngữ cảnh hệ thống Đăng ký học phần tại Trường ĐHCN.","options":[],"knownCorrect":[],"providedAnswer":""}],"knowledge":"- Actor là vai trò bên ngoài tương tác với hệ thống, có thể là người, hệ thống khác hoặc thiết bị. Vai trò chính là Giúp xác định ranh giới hệ thống và nguồn yêu cầu. Ví dụ áp dụng: Sinh viên, Quản trị viên, Cổng thanh toán là actor. Khi áp dụng Actor, cần gắn với mục tiêu: Giúp xác định ranh giới hệ thống và nguồn yêu cầu. Có thể nhận diện qua tình huống: Sinh viên, Quản trị viên, Cổng thanh toán là actor. Sai lầm cần tránh là Đưa module nội bộ thành actor dù không nằm ngoài hệ thống. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Class diagram là sơ đồ mô tả lớp, thuộc tính, phương thức và quan hệ tĩnh giữa các lớp. Vai trò chính là Giúp phân tích cấu trúc miền và thiết kế dữ liệu/đối tượng. Ví dụ áp dụng: lớp SinhVien liên kết với Phong và HoaDon. Khi áp dụng Class diagram, cần gắn với mục tiêu: Giúp phân tích cấu trúc miền và thiết kế dữ liệu/đối tượng. Có thể nhận diện qua tình huống: lớp SinhVien liên kết với Phong và HoaDon. Sai lầm cần tránh là Thêm lớp giao diện kỹ thuật quá sớm khi còn phân tích miền. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Context model là mô hình cho thấy hệ thống nằm trong môi trường nào và tương tác với hệ thống bên ngoài nào. Vai trò chính là Giúp xác định ranh giới, interface và phụ thuộc. Ví dụ áp dụng: hệ thống ký túc xá kết nối cổng thanh toán và hệ thống sinh viên. Khi áp dụng Context model, cần gắn với mục tiêu: Giúp xác định ranh giới, interface và phụ thuộc. Có thể nhận diện qua tình huống: hệ thống ký túc xá kết nối cổng thanh toán và hệ thống sinh viên. Sai lầm cần tránh là hiểu khái niệm quá hẹp, áp dụng máy móc hoặc bỏ qua bối cảnh dự án. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Elicitation là hoạt động khám phá và thu thập nhu cầu từ stakeholder, tài liệu, hệ thống hiện tại và bối cảnh sử dụng. Vai trò chính là Giảm rủi ro bỏ sót hoặc hiểu sai yêu cầu. Ví dụ áp dụng: phỏng vấn quản lý ký túc xá và quan sát quy trình đăng ký phòng. Khi áp dụng Elicitation, cần gắn với mục tiêu: Giảm rủi ro bỏ sót hoặc hiểu sai yêu cầu. Có thể nhận diện qua tình huống: phỏng vấn quản lý ký túc xá và quan sát quy trình đăng ký phòng. Sai lầm cần tránh là Không xác minh mâu thuẫn giữa các nguồn yêu cầu. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Extend là quan hệ bổ sung hành vi tùy chọn hoặc điều kiện vào use case cơ sở. Vai trò chính là Giúp mô hình hóa biến thể mà không làm rối luồng chính. Ví dụ áp dụng: Thanh toán online extend Thanh toán hóa đơn khi chọn phương thức online. Khi áp dụng Extend, cần gắn với mục t ế kiến trúc phần mềm","Yêu cầu chức năng có ảnh hưởng đến việc thiết kế kiến trúc phần mềm; yêu cầu phi chức năng không ảnh hưởng đến việc thiết kế kiến trúc phần mềm","Không có phát biểu nào ở trên là đúng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX07-Q009","kind":"mc","question":"Kiểu kiến trúc phân lớp là một dạng đặc biệt của kiểu client-server","options":["Sai","Đúng"],"knownCorrect":[],"providedAnswer":""},{"id":"EX07-Q010","kind":"essay","question":"Trình bày 3 ví dụ về thuộc tính chất lượng liên quan đến kiến trúc phần mềm?","options":[],"knownCorrect":[],"providedAnswer":""},{"id":"EX07-Q011","kind":"essay","question":"Trình bày các đặc điểm chính của mẫu kiến trúc phân lớp (layered) và mẫu kiến trúc pipe-filter?","options":[],"knownCorrect":[],"providedAnswer":""}],"knowledge":"- Architectural view là cách nhìn kiến trúc từ một góc quan tâm như logic, tiến trình, triển khai hoặc dữ liệu. Vai trò chính là Giúp stakeholder khác nhau hiểu phần liên quan. Ví dụ áp dụng: quản trị vận hành xem deployment view, dev xem component view. Khi áp dụng Architectural view, cần gắn với mục tiêu: Giúp stakeholder khác nhau hiểu phần liên quan. Có thể nhận diện qua tình huống: quản trị vận hành xem deployment view, dev xem component view. Sai lầm cần tránh là Chỉ có một view nên bỏ sót mối quan tâm vận hành. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Chuẩn hóa dữ liệu 1NF là dạng chuẩn yêu cầu giá trị trong mỗi ô là nguyên tử, không chứa nhóm lặp. Vai trò chính là Giảm dữ liệu lặp và lỗi cập nhật. Ví dụ áp dụng: tách danh sách số điện thoại sinh viên thành bảng liên quan thay vì một chuỗi dài. Khi áp dụng Chuẩn hóa dữ liệu 1NF, cần gắn với mục tiêu: Giảm dữ liệu lặp và lỗi cập nhật. Có thể nhận diện qua tình huống: tách danh sách số điện thoại sinh viên thành bảng liên quan thay vì một chuỗi dài. Sai lầm cần tránh là Bỏ qua 1nf rồi khó truy vấn và kiểm soát toàn vẹn. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Client-server là mô hình phân tách client yêu cầu dịch vụ và server cung cấp dịch vụ qua mạng. Vai trò chính là Phù hợp hệ thống nhiều người dùng và quản lý tập trung. Ví dụ áp dụng: trình duyệt gửi request đến server quản lý ký túc xá. Khi áp dụng Client-server, cần gắn với mục tiêu: Phù hợp hệ thống nhiều người dùng và quản lý tập trung. Có thể nhận diện qua tình huống: trình duyệt gửi request đến server quản lý ký túc xá. Sai lầm cần tránh là Đặt dữ liệu nhạy cảm trên client vì tiện. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Design pattern là giải pháp thiết kế đã được kiểm nghiệm cho một vấn đề lặp lại trong bối cảnh cụ thể. Vai trò chính là Tăng khả năng tái sử dụng ý tưởng và giao tiếp thiết kế. Ví dụ áp dụng: dùng Strategy để thay đổi thuật toán tính phí dịch vụ. Khi áp dụng Design pattern, cần gắn với mục tiêu: Tăng khả năng tái sử dụng ý tưởng và giao tiếp thiết kế. Có thể nhận diện qua tình huống: dùng Strategy để thay đổi thuật toán tính phí dịch vụ. Sai lầm cần tránh là Áp dụng pattern chỉ vì tên hay mà không có vấn đề phù hợp. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Kiến trúc phần mềm là cấu trúc cấp cao của hệ thống gồm thành phần, quan hệ, ràng buộc và quyết định thiết kế quan trọng. Vai trò chính là Định hình chất lượng như hiệu năng, bảo trì, bảo mật và mở rộng. Ví dụ áp dụng: hệ thống tách web, API, cơ sở dữ liệu và dịch vụ thanh toán. Khi áp dụng Kiến trúc phần mềm, cần gắn với mục tiêu: Định hình chất lượng như hiệu năng, bảo trì, bảo mật và mở rộng. Có thể nhận diện qua tình huống: hệ thống tách web, API, cơ sở dữ liệu và dịch vụ thanh toán. Sai lầm cần tránh là Chọn kiến trúc theo sở thích mà không dựa yêu cầu chất lượng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Layered architecture là kiến trúc chia hệ thống thành các tầng trách nhiệm như UI, nghiệp vụ, dữ liệu. Vai trò chính là Giảm phụ thuộc và hỗ trợ bảo trì. Ví dụ áp dụng: controller gọi service, service gọi repository. Khi áp dụng Layered architecture, cần gắn với mục tiêu: Giảm phụ thuộc và hỗ trợ bảo trì. Có thể nhận diện qua tình huống: controller gọi service, service gọi repository. Sai lầm cần tránh là Phá vỡ tầng bằng cách ui truy vấn thẳng database. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- MVC là mẫu tách Model, View và Controller để phân tách dữ liệu, giao diện và điều phối tương tác. Vai trò chính là Hỗ trợ thay đổi giao diện hoặc logic độc lập hơn. Ví dụ áp dụng: View hiển thị hóa đơn, Controller xử lý yêu cầu thanh toán, Model giữ dữ liệu. Khi áp dụng MVC, cần gắn với mục tiêu: Hỗ trợ thay đổi giao diện hoặc logic độc lập hơn. Có thể nhận diện qua tình huống: View hiển thị hóa đơn, Controller xử lý yêu cầu thanh toán, Model giữ dữ liệu. Sai lầm cần tránh là Đưa logic nghiệp vụ phức tạp vào view. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Nguyên tắc khả dụng là nguyên tắc giúp giao diện dễ học, hiệu quả, nhất quán, ít lỗi và hỗ trợ phục hồi. Vai trò chính là Giúp người dùng đạt mục tiêu với ít tải nhận thức. Ví dụ áp dụng: nút hủy và xác nhận có phản hồi rõ. Khi áp dụng Nguyên tắc khả dụng, cần gắn với mục tiêu: Giúp người dùng đạt mục tiêu với ít tải nhận thức. Có thể nhận diện qua tình huống: nút hủy và xác nhận có phản hồi rõ. Sai lầm cần tránh là Thiết kế mỗi màn hình một kiểu điều hướng khác nhau. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Repository architecture là kiến trúc dùng kho dữ liệu trung tâm cho nhiều thành phần truy cập và chia sẻ. Vai trò chính là Hữu ích khi dữ liệu chung là trung tâm của hệ thống. Ví dụ áp dụng: nhiều module cùng dùng cơ sở dữ liệu sinh viên. Khi áp dụng Repository architecture, cần gắn với mục tiêu: Hữu ích khi dữ liệu chung là trung tâm của hệ thống. Có thể nhận diện qua tình huống: nhiều module cùng dùng cơ sở dữ liệu sinh viên. Sai lầm cần tránh là Tạo repository thành điểm nghẽn mà không kiểm soát hiệu năng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Strategy pattern là mẫu đóng gói các thuật toán thay thế nhau và cho phép chọn thuật toán lúc chạy. Vai trò chính là Giúp thay đổi chính sách mà không sửa lớp dùng thuật toán. Ví dụ áp dụng: tính phí giặt là theo lượt hoặc theo tháng bằng các strategy khác nhau. Khi áp dụng Strategy pattern, cần gắn với mục tiêu: Giúp thay đổi chính sách mà không sửa lớp dùng thuật toán. Có thể nhận diện qua tình huống: tính phí giặt là theo lượt hoặc theo tháng bằng các strategy khác nhau. Sai lầm cần tránh là Dùng strategy khi chỉ có một cách xử lý đơn giản không đổi. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Subsystem design là thiết kế hệ thống thành các phân hệ có trách nhiệm và giao diện rõ. Vai trò chính là Giảm độ phức tạp và hỗ trợ phân công phát triển. Ví dụ áp dụng: tách phân hệ quản lý phòng, dịch vụ, hóa đơn và báo cáo. Khi áp dụng Subsystem design, cần gắn với mục tiêu: Giảm độ phức tạp và hỗ trợ phân công phát triển. Có thể nhận diện qua tình huống: tách phân hệ quản lý phòng, dịch vụ, hóa đơn và báo cáo. Sai lầm cần tránh là hiểu khái niệm quá hẹp, áp dụng máy móc hoặc bỏ qua bối cảnh dự án. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Thiết kế giao diện người dùng là thiết kế cách người dùng tương tác với hệ thống qua màn hình, luồng thao tác và phản hồi. Vai trò chính là Ảnh hưởng trực tiếp tới khả dụng và lỗi thao tác. Ví dụ áp dụng: màn hình thanh toán hiển thị phí, hạn nộp và nút xác nhận rõ ràng. Khi áp dụng Thiết kế giao diện người dùng, cần gắn với mục tiêu: Ảnh hưởng trực tiếp tới khả dụng và lỗi thao tác. Có thể nhận diện qua tình huống: màn hình thanh toán hiển thị phí, hạn nộp và nút xác nhận rõ ràng. Sai lầm cần tránh là Bỏ qua người dùng thực khi thiết kế workflow. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Thiết kế hướng người dùng là quy trình đặt nhu cầu, bối cảnh và phản hồi người dùng vào trung tâm thiết kế. Vai trò chính là Giảm nguy cơ xây giao diện không phù hợp thực tế. Ví dụ áp dụng: quan sát sinh viên dùng hệ thống trước khi thiết kế form đăng ký. Khi áp dụng Thiết kế hướng người dùng, cần gắn với mục tiêu: Giảm nguy cơ xây giao diện không phù hợp thực tế. Có thể nhận diện qua tình huống: quan sát sinh viên dùng hệ thống trước khi thiết kế form đăng ký. Sai lầm cần tránh là Thiết kế theo giả định mà không kiểm chứng với người dùng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.","referenceSources":"08-Thiet ke kien truc; 09-UI-Design; 10_2, 10_3, 10_4; Application Architectures; DesignPatterns; HCI; Ôn tập bài 6; Sommerville Ch.6-7; Pressman Ch.9-14"},{"id":"EX08","title":"Bài 9 - Thiết kế giao diện người dùng","sourceFile":"testBank_Bai09_ThietKeGUI_DETHI.docx","chapters":[6],"mcCount":17,"essayCount":2,"questions":[{"id":"EX08-Q001","kind":"mc","question":"Một trong các nguyên tắc thiết kế giao diện người dùng là không nên để n iên có kinh nghiệm hỗ trợ"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q010","kind":"mc","question":"Hệ thống phát triển giao diện người dùng (công cụ hỗ trợ xây dựng giao diện người dùng) cung cấp nhiều cơ chế để xây dựng bản mẫu giao diện, bao gồm:","options":["Sinh mã nguồn","Tính năng vẽ","Thẩm định đầu vào của giao diện"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q011","kind":"mc","question":"Bảng hỏi về khả năng sử dụng của giao diện người dùng là hữu ích nhất cho nhà thiết kế giao diện khi nó được trả lời bởi …","options":["Khách hàng (customers)","Lập trình viên giàu kinh nghiệm","Người dùng cuối (end users)"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q012","kind":"mc","question":"Nhiều độ đo về khả năng sử dụng giao diện được thu thập khi quan sát người dùng tương tác với phần mềm, bao gồm:","options":["Số lượng lỗi trong thao tác của người dùng","Tính tin cậy của phần mềm","Thời gian mà người dùng tiêu tốn vào việc tra cứu trợ giúp"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q013","kind":"mc","question":"Nhiều độ đo về khả năng sử dụng giao diện được thu thập khi quan sát người dùng tương tác với phần mềm, bao gồm:","options":["Khi xây dựng các thông báo cho giao diện, số lượng thông báo càng nhiều thì càng tốt.","Để thông tin hiển thị là chính xác, trực quan và dễ cài đặt, nên sử dụng kiểu hiển thị bằng văn bản.","Khi thiết kế giao diện, đối với những công việc xử lý mất nhiều thời gian thì hệ thống phải chứng tỏ với người dùng rằng hệ thống đang hoạt động"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q014","kind":"mc","question":"Mô tả nào dưới đây là đúng về hoạt động thiết kế giao diện","options":["Bản mẫu của giao diện có thể được xây dựng khi mô tả kịch bản người dùng","Thiết kế giao diện nên hướng người dùng","Thiết kế giao diện dựa trên tài liệu đặc tả yêu cầu"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q015","kind":"mc","question":"Thiết kế giao diện là quan trọng bởi vì:","options":["Nó là hoạt động khó khăn nhất trong quy trình sản xuất phần mềm","Người dùng đánh giá chất lượng phần mềm thông qua giao diện","Giao diện là phương tiện để người dùng thực hiện các tính năng của phần mềm"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q016","kind":"mc","question":"Yêu cầu nào dưới đây là yêu cầu cần đặt ra cho hoạt động thiết kế giao diện","options":["Giao diện độc lập với xử lý","Giao diện cần dễ sửa đổi"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q017","kind":"mc","question":"Điều nào là đúng khi nhận xét về giao diện kiểu tương tác dòng lệnh là:","options":["Ưu điểm: dễ dùng với bất kỳ người dùng nào","Ưu điểm: tốc độ tương tác của người dùng","Nhược điểm: đòi hỏi người dùng phải nhớ cú pháp câu lệnh"],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q018","kind":"essay","question":"Trình bày các bước trong quy trình thiết kế giao diện người dùng?","options":[],"knownCorrect":[],"providedAnswer":""},{"id":"EX08-Q019","kind":"essay","question":"Nêu tầm quan trọng của thiết kế giao diện người dùng","options":[],"knownCorrect":[],"providedAnswer":""}],"knowledge":"- Architectural view là cách nhìn kiến trúc từ một góc quan tâm như logic, tiến trình, triển khai hoặc dữ liệu. Vai trò chính là Giúp stakeholder khác nhau hiểu phần liên quan. Ví dụ áp dụng: quản trị vận hành xem deployment view, dev xem component view. Khi áp dụng Architectural view, cần gắn với mục tiêu: Giúp stakeholder khác nhau hiểu phần liên quan. Có thể nhận diện qua tình huống: quản trị vận hành xem deployment view, dev xem component view. Sai lầm cần tránh là Chỉ có một view nên bỏ sót mối quan tâm vận hành. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Chuẩn hóa dữ liệu 1NF là dạng chuẩn yêu cầu giá trị trong mỗi ô là nguyên tử, không chứa nhóm lặp. Vai trò chính là Giảm dữ liệu lặp và lỗi cập nhật. Ví dụ áp dụng: tách danh sách số điện thoại sinh viên thành bảng liên quan thay vì một chuỗi dài. Khi áp dụng Chuẩn hóa dữ liệu 1NF, cần gắn với mục tiêu: Giảm dữ liệu lặp và lỗi cập nhật. Có thể nhận diện qua tình huống: tách danh sách số điện thoại sinh viên thành bảng liên quan thay vì một chuỗi dài. Sai lầm cần tránh là Bỏ qua 1nf rồi khó truy vấn và kiểm soát toàn vẹn. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Client-server là mô hình phân tách client yêu cầu dịch vụ và server cung cấp dịch vụ qua mạng. Vai trò chính là Phù hợp hệ thống nhiều người dùng và quản lý tập trung. Ví dụ áp dụng: trình duyệt gửi request đến server quản lý ký túc xá. Khi áp dụng Client-server, cần gắn với mục tiêu: Phù hợp hệ thống nhiều người dùng và quản lý tập trung. Có thể nhận diện qua tình huống: trình duyệt gửi request đến server quản lý ký túc xá. Sai lầm cần tránh là Đặt dữ liệu nhạy cảm trên client vì tiện. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Design pattern là giải pháp thiết kế đã được kiểm nghiệm cho một vấn đề lặp lại trong bối cảnh cụ thể. Vai trò chính là Tăng khả năng tái sử dụng ý tưởng và giao tiếp thiết kế. Ví dụ áp dụng: dùng Strategy để thay đổi thuật toán tính phí dịch vụ. Khi áp dụng Design pattern, cần gắn với mục tiêu: Tăng khả năng tái sử dụng ý tưởng và giao tiếp thiết kế. Có thể nhận diện qua tình huống: dùng Strategy để thay đổi thuật toán tính phí dịch vụ. Sai lầm cần tránh là Áp dụng pattern chỉ vì tên hay mà không có vấn đề phù hợp. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Kiến trúc phần mềm là cấu trúc cấp cao của hệ thống gồm thành phần, quan hệ, ràng buộc và quyết định thiết kế quan trọng. Vai trò chính là Định hình chất lượng như hiệu năng, bảo trì, bảo mật và mở rộng. Ví dụ áp dụng: hệ thống tách web, API, cơ sở dữ liệu và dịch vụ thanh toán. Khi áp dụng Kiến trúc phần mềm, cần gắn với mục tiêu: Định hình chất lượng như hiệu năng, bảo trì, bảo mật và mở rộng. Có thể nhận diện qua tình huống: hệ thống tách web, API, cơ sở dữ liệu và dịch vụ thanh toán. Sai lầm cần tránh là Chọn kiến trúc theo sở thích mà không dựa yêu cầu chất lượng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Layered architecture là kiến trúc chia hệ thống thành các tầng trách nhiệm như UI, nghiệp vụ, dữ liệu. Vai trò chính là Giảm phụ thuộc và hỗ trợ bảo trì. Ví dụ áp dụng: controller gọi service, service gọi repository. Khi áp dụng Layered architecture, cần gắn với mục tiêu: Giảm phụ thuộc và hỗ trợ bảo trì. Có thể nhận diện qua tình huống: controller gọi service, service gọi repository. Sai lầm cần tránh là Phá vỡ tầng bằng cách ui truy vấn thẳng database. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- MVC là mẫu tách Model, View và Controller để phân tách dữ liệu, giao diện và điều phối tương tác. Vai trò chính là Hỗ trợ thay đổi giao diện hoặc logic độc lập hơn. Ví dụ áp dụng: View hiển thị hóa đơn, Controller xử lý yêu cầu thanh toán, Model giữ dữ liệu. Khi áp dụng MVC, cần gắn với mục tiêu: Hỗ trợ thay đổi giao diện hoặc logic độc lập hơn. Có thể nhận diện qua tình huống: View hiển thị hóa đơn, Controller xử lý yêu cầu thanh toán, Model giữ dữ liệu. Sai lầm cần tránh là Đưa logic nghiệp vụ phức tạp vào view. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Nguyên tắc khả dụng là nguyên tắc giúp giao diện dễ học, hiệu quả, nhất quán, ít lỗi và hỗ trợ phục hồi. Vai trò chính là Giúp người dùng đạt mục tiêu với ít tải nhận thức. Ví dụ áp dụng: nút hủy và xác nhận có phản hồi rõ. Khi áp dụng Nguyên tắc khả dụng, cần gắn với mục tiêu: Giúp người dùng đạt mục tiêu với ít tải nhận thức. Có thể nhận diện qua tình huống: nút hủy và xác nhận có phản hồi rõ. Sai lầm cần tránh là Thiết kế mỗi màn hình một kiểu điều hướng khác nhau. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Repository architecture là kiến trúc dùng kho dữ liệu trung tâm cho nhiều thành phần truy cập và chia sẻ. Vai trò chính là Hữu ích khi dữ liệu chung là trung tâm của hệ thống. Ví dụ áp dụng: nhiều module cùng dùng cơ sở dữ liệu sinh viên. Khi áp dụng Repository architecture, cần gắn với mục tiêu: Hữu ích khi dữ liệu chung là trung tâm của hệ thống. Có thể nhận diện qua tình huống: nhiều module cùng dùng cơ sở dữ liệu sinh viên. Sai lầm cần tránh là Tạo repository thành điểm nghẽn mà không kiểm soát hiệu năng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Strategy pattern là mẫu đóng gói các thuật toán thay thế nhau và cho phép chọn thuật toán lúc chạy. Vai trò chính là Giúp thay đổi chính sách mà không sửa lớp dùng thuật toán. Ví dụ áp dụng: tính phí giặt là theo lượt hoặc theo tháng bằng các strategy khác nhau. Khi áp dụng Strategy pattern, cần gắn với mục tiêu: Giúp thay đổi chính sách mà không sửa lớp dùng thuật toán. Có thể nhận diện qua tình huống: tính phí giặt là theo lượt hoặc theo tháng bằng các strategy khác nhau. Sai lầm cần tránh là Dùng strategy khi chỉ có một cách xử lý đơn giản không đổi. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Subsystem design là thiết kế hệ thống thành các phân hệ có trách nhiệm và giao diện rõ. Vai trò chính là Giảm độ phức tạp và hỗ trợ phân công phát triển. Ví dụ áp dụng: tách phân hệ quản lý phòng, dịch vụ, hóa đơn và báo cáo. Khi áp dụng Subsystem design, cần gắn với mục tiêu: Giảm độ phức tạp và hỗ trợ phân công phát triển. Có thể nhận diện qua tình huống: tách phân hệ quản lý phòng, dịch vụ, hóa đơn và báo cáo. Sai lầm cần tránh là hiểu khái niệm quá hẹp, áp dụng máy móc hoặc bỏ qua bối cảnh dự án. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Thiết kế giao diện người dùng là thiết kế cách người dùng tương tác với hệ thống qua màn hình, luồng thao tác và phản hồi. Vai trò chính là Ảnh hưởng trực tiếp tới khả dụng và lỗi thao tác. Ví dụ áp dụng: màn hình thanh toán hiển thị phí, hạn nộp và nút xác nhận rõ ràng. Khi áp dụng Thiết kế giao diện người dùng, cần gắn với mục tiêu: Ảnh hưởng trực tiếp tới khả dụng và lỗi thao tác. Có thể nhận diện qua tình huống: màn hình thanh toán hiển thị phí, hạn nộp và nút xác nhận rõ ràng. Sai lầm cần tránh là Bỏ qua người dùng thực khi thiết kế workflow. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Thiết kế hướng người dùng là quy trình đặt nhu cầu, bối cảnh và phản hồi người dùng vào trung tâm thiết kế. Vai trò chính là Giảm nguy cơ xây giao diện không phù hợp thực tế. Ví dụ áp dụng: quan sát sinh viên dùng hệ thống trước khi thiết kế form đăng ký. Khi áp dụng Thiết kế hướng người dùng, cần gắn với mục tiêu: Giảm nguy cơ xây giao diện không phù hợp thực tế. Có thể nhận diện qua tình huống: quan sát sinh viên dùng hệ thống trước khi thiết kế form đăng ký. Sai lầm cần tránh là Thiết kế theo giả định mà không kiểm chứng với người dùng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.","referenceSources":"08-Thiet ke kien truc; 09-UI-Design; 10_2, 10_3, 10_4; Application Architectures; DesignPatterns; HCI; Ôn tập bài 6; Sommerville Ch.6-7; Pressm inh viên thành bảng liên quan thay vì một chuỗi dài. Khi áp dụng Chuẩn hóa dữ liệu 1NF, cần gắn với mục tiêu: Giảm dữ liệu lặp và lỗi cập nhật. Có thể nhận diện qua tình huống: tách danh sách số điện thoại sinh viên thành bảng liên quan thay vì một chuỗi dài. Sai lầm cần tránh là Bỏ qua 1nf rồi khó truy vấn và kiểm soát toàn vẹn. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Client-server là mô hình phân tách client yêu cầu dịch vụ và server cung cấp dịch vụ qua mạng. Vai trò chính là Phù hợp hệ thống nhiều người dùng và quản lý tập trung. Ví dụ áp dụng: trình duyệt gửi request đến server quản lý ký túc xá. Khi áp dụng Client-server, cần gắn với mục tiêu: Phù hợp hệ thống nhiều người dùng và quản lý tập trung. Có thể nhận diện qua tình huống: trình duyệt gửi request đến server quản lý ký túc xá. Sai lầm cần tránh là Đặt dữ liệu nhạy cảm trên client vì tiện. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Design pattern là giải pháp thiết kế đã được kiểm nghiệm cho một vấn đề lặp lại trong bối cảnh cụ thể. Vai trò chính là Tăng khả năng tái sử dụng ý tưởng và giao tiếp thiết kế. Ví dụ áp dụng: dùng Strategy để thay đổi thuật toán tính phí dịch vụ. Khi áp dụng Design pattern, cần gắn với mục tiêu: Tăng khả năng tái sử dụng ý tưởng và giao tiếp thiết kế. Có thể nhận diện qua tình huống: dùng Strategy để thay đổi thuật toán tính phí dịch vụ. Sai lầm cần tránh là Áp dụng pattern chỉ vì tên hay mà không có vấn đề phù hợp. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Kiến trúc phần mềm là cấu trúc cấp cao của hệ thống gồm thành phần, quan hệ, ràng buộc và quyết định thiết kế quan trọng. Vai trò chính là Định hình chất lượng như hiệu năng, bảo trì, bảo mật và mở rộng. Ví dụ áp dụng: hệ thống tách web, API, cơ sở dữ liệu và dịch vụ thanh toán. Khi áp dụng Kiến trúc phần mềm, cần gắn với mục tiêu: Định hình chất lượng như hiệu năng, bảo trì, bảo mật và mở rộng. Có thể nhận diện qua tình huống: hệ thống tách web, API, cơ sở dữ liệu và dịch vụ thanh toán. Sai lầm cần tránh là Chọn kiến trúc theo sở thích mà không dựa yêu cầu chất lượng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Layered architecture là kiến trúc chia hệ thống thành các tầng trách nhiệm như UI, nghiệp vụ, dữ liệu. Vai trò chính là Giảm phụ thuộc và hỗ trợ bảo trì. Ví dụ áp dụng: controller gọi service, service gọi repository. Khi áp dụng Layered architecture, cần gắn với mục tiêu: Giảm phụ thuộc và hỗ trợ bảo trì. Có thể nhận diện qua tình huống: controller gọi service, service gọi repository. Sai lầm cần tránh là Phá vỡ tầng bằng cách ui truy vấn thẳng database. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- MVC là mẫu tách Model, View và Controller để phân tách dữ liệu, giao diện và điều phối tương tác. Vai trò chính là Hỗ trợ thay đổi giao diện hoặc logic độc lập hơn. Ví dụ áp dụng: View hiển thị hóa đơn, Controller xử lý yêu cầu thanh toán, Model giữ dữ liệu. Khi áp dụng MVC, cần gắn với mục tiêu: Hỗ trợ thay đổi giao diện hoặc logic độc lập hơn. Có thể nhận diện qua tình huống: View hiển thị hóa đơn, Controller xử lý yêu cầu thanh toán, Model giữ dữ liệu. Sai lầm cần tránh là Đưa logic nghiệp vụ phức tạp vào view. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Nguyên tắc khả dụng là nguyên tắc giúp giao diện dễ học, hiệu quả, nhất quán, ít lỗi và hỗ trợ phục hồi. Vai trò chính là Giúp người dùng đạt mục tiêu với ít tải nhận thức. Ví dụ áp dụng: nút hủy và xác nhận có phản hồi rõ. Khi áp dụng Nguyên tắc khả dụng, cần gắn với mục tiêu: Giúp người dùng đạt mục tiêu với ít tải nhận thức. Có thể nhận diện qua tình huống: nút hủy và xác nhận có phản hồi rõ. Sai lầm cần tránh là Thiết kế mỗi màn hình một kiểu điều hướng khác nhau. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Repository architecture là kiến trúc dùng kho dữ liệu trung tâm cho nhiều thành phần truy cập và chia sẻ. Vai trò chính là Hữu ích khi dữ liệu chung là trung tâm của hệ thống. Ví dụ áp dụng: nhiều module cùng dùng cơ sở dữ liệu sinh viên. Khi áp dụng Repository architecture, cần gắn với mục tiêu: Hữu ích khi dữ liệu chung là trung tâm của hệ thống. Có thể nhận diện qua tình huống: nhiều module cùng dùng cơ sở dữ liệu sinh viên. Sai lầm cần tránh là Tạo repository thành điểm nghẽn mà không kiểm soát hiệu năng. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Strategy pattern là mẫu đóng gói các thuật toán thay thế nhau và cho phép chọn thuật toán lúc chạy. Vai trò chính là Giúp thay đổi chính sách mà không sửa lớp dùng thuật toán. Ví dụ áp dụng: tính phí giặt là theo lượt hoặc theo tháng bằng các strategy khác nhau. Khi áp dụng Strategy pattern, cần gắn với mục tiêu: Giúp thay đổi chính sách mà không sửa lớp dùng thuật toán. Có thể nhận diện qua tình huống: tính phí giặt là theo lượt hoặc theo tháng bằng các strategy khác nhau. Sai lầm cần tránh là Dùng strategy khi chỉ có một cách xử lý đơn giản không đổi. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Subsystem design là thiết kế hệ thống thành các phân hệ có trách nhiệm và giao diện rõ. Vai trò chính là Giảm độ phức tạp và hỗ trợ phân công phát triển. Ví dụ áp dụng: tách phân hệ quản lý ph ature branch cho chức năng báo cáo doanh thu. Sai lầm cần tránh là Nhánh sống quá lâu gây xung đột tích hợp lớn. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Cài đặt mã nguồn là chuyển thiết kế thành mã chạy được theo chuẩn kỹ thuật, quy ước và môi trường dự án. Vai trò chính là Hiện thực hóa chức năng nhưng vẫn giữ khả năng bảo trì. Ví dụ áp dụng: lập trình service đăng ký dịch vụ theo thiết kế đã thống nhất. Khi áp dụng Cài đặt mã nguồn, cần gắn với mục tiêu: Hiện thực hóa chức năng nhưng vẫn giữ khả năng bảo trì. Có thể nhận diện qua tình huống: lập trình service đăng ký dịch vụ theo thiết kế đã thống nhất. Sai lầm cần tránh là Code theo cảm hứng mà không theo kiến trúc. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- CI/CD là tự động hóa tích hợp, kiểm thử, đóng gói và triển khai phần mềm qua pipeline. Vai trò chính là Phát hiện lỗi sớm và rút ngắn thời gian phát hành. Ví dụ áp dụng: GitHub Actions chạy test mỗi khi push. Khi áp dụng CI/CD, cần gắn với mục tiêu: Phát hiện lỗi sớm và rút ngắn thời gian phát hành. Có thể nhận diện qua tình huống: GitHub Actions chạy test mỗi khi push. Sai lầm cần tránh là Deploy tự động nhưng bỏ qua kiểm thử và phê duyệt cần thiết. Cách tránh là xác định đúng bối cảnh, tiêu chí kiểm chứng và liên hệ với các hoạt động yêu cầu, thiết kế, cài đặt, kiểm thử hoặc bảo trì tương ứng.\n- Clean code là mã nguồn rõ nghĩa, đơn giản, nhất quán, dễ đọc, dễ kiểm thử và dễ thay đổi. Vai trò chính là Giảm chi phí bảo trì và lỗi khi mở rộng. Ví dụ áp dụng: hàm tính phí có tên rõ, ít nhánh phức tạp và test đi kèm. Khi áp dụng Clean code, cần gắn với mục tiêu: Giảm chi phí bảo trì và lỗi khi mở rộng. Có thể nhận diện qua tình huống: hàm tính phí có tên rõ, ít nhánh phức tạp và test đi kèm. Sai lầm cần tránh là Tối ưu vi mô làm code rối khi chưa
